schema_version: 1
tasks:
  # go.yml: build (os=ubuntu-latest)
  # NOTE: $GITHUB_ENV, $GITHUB_PATH and $GITHUB_OUTPUT are emulated with temp files, loaded before each step
  build-ubuntu-latest:
    argv:
      - bash
      - -eo
      - pipefail
      - -c
      - |-
        export GITHUB_ENV=$(mktemp) GITHUB_PATH=$(mktemp) GITHUB_OUTPUT=$(mktemp) GITHUB_STEP_SUMMARY=/dev/null
        trap 'rm -f "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT"' EXIT
        _gh_load() {
          local l n d v x p
          while IFS= read -r l; do
            n=${l%%=*}
            if [[ $n == *'<<'* ]]; then
              n=${l%%<<*} d=${l#*<<} v=
              while IFS= read -r x && [[ $x != "$d" ]]; do v+=${v:+$'\n'}$x; done
              export "$n=$v"
            elif [[ $l == *=* ]]; then
              export "$n=${l#*=}"
            fi
          done <"$GITHUB_ENV"
          while IFS= read -r p; do [[ -n $p ]] && PATH=$p:$PATH; done <"$GITHUB_PATH"
        }
        (
          _gh_load
          cd .
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        )
        (
          _gh_load
        go mod download
        )
        (
          _gh_load
        go test -race -tags=integration ./...
        )
        (
          _gh_load
        go build -v ./cmd/gh
        )
    platform: linux/amd64
    runtime:
      go: 1.27.3
    toolchain:
      - cmd: [go, version]
    covers: go.yml#build
